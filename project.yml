# Reference spec. The dependency-free, verified generator is:
# python3 scripts/generate-native-project.py
# This file documents the native project; no XcodeGen installation is required.
name: HowToAdult
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  DEVELOPMENT_TEAM: EJLR2RPSV2
  PRODUCT_BUNDLE_IDENTIFIER: com.nathanfennel.How-To-Adult
  PRODUCT_MODULE_NAME: HowToAdult
  PRODUCT_NAME: How to Adult
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  HowToAdult-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources/Assets.xcassets, Content/catalog.json, Configuration/PrivacyInfo.xcprivacy]
    info: Configuration/iOS-Info.plist
    entitlements: Configuration/iOS.entitlements
    deviceFamily: [iPhone, iPad]
  HowToAdult-macOS:
    type: application
    platform: macOS
    sources: [Sources]
    resources: [Resources/Assets.xcassets, Content/catalog.json, Configuration/PrivacyInfo.xcprivacy]
    info: Configuration/macOS-Info.plist
    entitlements: Configuration/macOS.entitlements
  HowToAdultTests-iOS:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    resources: [Content/catalog.json]
    dependencies: [HowToAdult-iOS]
  HowToAdultTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    resources: [Content/catalog.json]
    dependencies: [HowToAdult-macOS]
  HowToAdultUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [HowToAdult-iOS]
  HowToAdultUITests-macOS:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies: [HowToAdult-macOS]
